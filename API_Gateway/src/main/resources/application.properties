spring.application.name=api-gateway

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:8080

# Course Service Route
spring.cloud.gateway.server.webflux.routes[0].id=course-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://COURSE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/courses/**

# Enrollment Service Route
spring.cloud.gateway.server.webflux.routes[1].id=enrollment-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ENROLLMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/enrollments/**

# Payment Service Route
spring.cloud.gateway.server.webflux.routes[2].id=payment-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/payments/**

# Student Service
spring.cloud.gateway.server.webflux.routes[3].id=student-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://student-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/students/**

# Instructor Service
spring.cloud.gateway.server.webflux.routes[4].id=instructor-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://instructor-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/instructors/**

# Admin Service
spring.cloud.gateway.server.webflux.routes[5].id=admin-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://admin-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/admin/**

# Auth Service Route
spring.cloud.gateway.server.webflux.routes[6].id=auth-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/auth/**